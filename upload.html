<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Siêu Nét & Nén Dung Lượng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 15px; background: #f4f6f8; }
    .btn { background: #007bff; color: white; border: none; padding: 10px 14px; font-size: 14px; border-radius: 6px; cursor: pointer; margin: 4px; }
    .btn-gallery { background: #17a2b8; }
    .btn-mode { background: #6c757d; }
    .btn-mode.active { background: #28a745; font-weight: bold; border: 2px solid #1e7e34; }
    .btn-success { background: #28a745; font-weight: bold; width: 90%; margin-top: 10px; padding: 14px; font-size: 16px; }
    .btn-rotate { background: #ffc107; color: #000; }
    #img-container { max-width: 100%; max-height: 360px; margin: 15px 0; display: none; background: #e9ecef; }
    img { max-width: 100%; }
    .mode-group { margin: 10px 0; }
  </style>
</head>
<body>
  <h2>✨ Scan Siêu Nét & Nén Dung Lượng</h2>
  
  <input type="file" id="photoCamera" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="photoGallery" accept="image/*" style="display:none">

  <button class="btn" onclick="document.getElementById('photoCamera').click()">📸 Chụp mới</button>
  <button class="btn btn-gallery" onclick="document.getElementById('photoGallery').click()">🖼️ Chọn từ máy</button>

  <div id="img-container">
    <img id="image" src="">
  </div>

  <div id="tools" style="display:none;">
    <div class="mode-group">
      <button class="btn btn-mode active" id="btnSuperClear" onclick="setMode('super')">⚡ Tăng Nét & Nén Cực Nhẹ</button>
      <button class="btn btn-mode" id="btnOriginal" onclick="setMode('original')">🎨 Ảnh Gốc</button>
    </div>
    <button class="btn btn-rotate" onclick="cropper.rotate(-90)">↺ Xoay trái</button>
    <button class="btn btn-rotate" onclick="cropper.rotate(90)">↻ Xoay phải</button>
    <br>
    <button class="btn btn-success" onclick="uploadImage()">✅ XÁC NHẬN & GỬI LÊN PC</button>
  </div>

  <p id="status" style="font-weight:bold; margin-top:15px; color:#d9534f;"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session');
    const FIREBASE_URL = "https://my-qr-upload-default-rtdb.firebaseio.com";

    let cropper = null;
    let currentMode = 'super';
    const image = document.getElementById('image');

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        image.src = event.target.result;
        document.getElementById('img-container').style.display = 'block';
        document.getElementById('tools').style.display = 'block';

        if (cropper) cropper.destroy();
        cropper = new Cropper(image, {
          viewMode: 1,
          autoCropArea: 0.98,
          responsive: true
        });
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('photoCamera').onchange = handleFileSelect;
    document.getElementById('photoGallery').onchange = handleFileSelect;

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnSuperClear').classList.toggle('active', mode === 'super');
      document.getElementById('btnOriginal').classList.toggle('active', mode === 'original');
    }

    // Thuật toán Tẩy Nền Bóng Mờ + Đẩy Tương Phản Viền
    function applySuperClearProcessing(canvas) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = w;
      tempCanvas.height = h;
      const tempCtx = tempCanvas.getContext('2d');
      
      // Tăng tương phản nhẹ và kéo sán nền
      tempCtx.filter = 'contrast(135%) brightness(106%) saturate(110%)';
      tempCtx.drawImage(canvas, 0, 0);

      const imgData = tempCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // Dọn sạch nhiễu bóng mờ vùng nền giấy xám -> Trắng tinh
      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];

        // Vùng giấy sáng / bóng mờ nhạt -> Đẩy thẳng lên trắng #FFFFFF
        if (r > 150 && g > 140 && b > 130 && Math.abs(r - g) < 45) {
          data[i]     = Math.min(255, r * 1.3);
          data[i + 1] = Math.min(255, g * 1.3);
          data[i + 2] = Math.min(255, b * 1.3);
        } 
        // Vùng chữ / sóng nét vẽ đen -> Đẩy độ sẫm để tương phản rõ
        else if (r < 90 && g < 90 && b < 90) {
          data[i]     = Math.max(0, r * 0.7);
          data[i + 1] = Math.max(0, g * 0.7);
          data[i + 2] = Math.max(0, b * 0.7);
        }
      }
      tempCtx.putImageData(imgData, 0, 0);

      // Ma trận lọc làm nét Unsharp Mask
      const buff = new Uint8ClampedArray(data);
      const mix = 0.45; // Độ đanh nét viền

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = (y * w + x) * 4;
          for (let c = 0; c < 3; c++) {
            const center = buff[idx + c];
            const up = buff[((y - 1) * w + x) * 4 + c];
            const down = buff[((y + 1) * w + x) * 4 + c];
            const left = buff[(y * w + (x - 1)) * 4 + c];
            const right = buff[(y * w + (x + 1)) * 4 + c];

            const sharpened = center * 5 - (up + down + left + right);
            data[idx + c] = Math.min(255, Math.max(0, center * (1 - mix) + sharpened * mix));
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    async function uploadImage() {
      if (!cropper) return;
      document.getElementById('status').style.color = "#d9534f";
      document.getElementById('status').innerText = "⏳ Đang tối ưu độ nét 2K & nén siêu nhẹ...";

      const canvas = cropper.getCroppedCanvas({ 
        maxWidth: 2048, 
        maxHeight: 2048,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      });

      if (currentMode === 'super') {
        applySuperClearProcessing(canvas);
      }

      // Nén nén thông minh với chất lượng 0.72 (Nền trắng giúp nén cực mạnh)
      const base64Image = canvas.toDataURL('image/jpeg', 0.72);

      try {
        const res = await fetch(`${FIREBASE_URL}/sessions/${session}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: base64Image })
        });

        if (res.ok) {
          document.getElementById('status').style.color = "#28a745";
          const approxSize = Math.round((base64Image.length * 3 / 4) / 1024);
          document.getElementById('status').innerText = `✅ Đã gửi! Kích thước siêu nhẹ: ~${approxSize} KB`;
        } else {
          document.getElementById('status').innerText = "❌ Lỗi kết nối Firebase!";
        }
      } catch (err) {
        document.getElementById('status').innerText = "❌ Lỗi đường truyền mạng!";
      }
    }
  </script>
</body>
</html>
