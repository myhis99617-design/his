<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chụp & Chỉnh Sửa Ảnh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 15px; background: #f4f6f8; }
    .btn { background: #007bff; color: white; border: none; padding: 12px 18px; font-size: 15px; border-radius: 6px; cursor: pointer; margin: 5px; }
    .btn-success { background: #28a745; font-weight: bold; }
    .btn-warning { background: #ffc107; color: #000; }
    #img-container { max-width: 100%; max-height: 380px; margin: 15px 0; display: none; background: #e9ecef; }
    img { max-width: 100%; }
  </style>
</head>
<body>
  <h2>📸 Chụp & Chỉnh Sửa Ảnh</h2>
  
  <input type="file" id="photo" accept="image/*" capture="environment" style="display:none">
  <button class="btn" onclick="document.getElementById('photo').click()">📸 Chụp / Chọn ảnh</button>

  <div id="img-container">
    <img id="image" src="">
  </div>

  <div id="tools" style="display:none;">
    <button class="btn btn-warning" onclick="cropper.rotate(-90)">↺ Xoay trái</button>
    <button class="btn btn-warning" onclick="cropper.rotate(90)">↻ Xoay phải</button>
    <br>
    <button class="btn btn-success" onclick="uploadImage()">✅ XÁC NHẬN & GỬI LÊN PC</button>
  </div>

  <p id="status" style="font-weight:bold; margin-top:15px; color:#d9534f;"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session');
    
    // Đã điền sẵn URL Firebase của bạn
    const FIREBASE_URL = "https://my-qr-upload-default-rtdb.firebaseio.com";

    let cropper = null;
    const image = document.getElementById('image');

    document.getElementById('photo').onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        image.src = event.target.result;
        document.getElementById('img-container').style.display = 'block';
        document.getElementById('tools').style.display = 'block';

        if (cropper) cropper.destroy();
        cropper = new Cropper(image, {
          viewMode: 1,
          autoCropArea: 0.9,
          responsive: true
        });
      };
      reader.readAsDataURL(file);
    };

    async function uploadImage() {
      if (!cropper) return;
      document.getElementById('status').innerText = "⏳ Đang nén ảnh & chuyển về máy tính...";

      // Cắt ảnh và xuất ra dạng chuỗi Base64 đã nén nhẹ
      const canvas = cropper.getCroppedCanvas({ maxWidth: 1280, maxHeight: 1280 });
      const base64Image = canvas.toDataURL('image/jpeg', 0.8);

      try {
        const res = await fetch(`${FIREBASE_URL}/sessions/${session}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: base64Image })
        });

        if (res.ok) {
          document.getElementById('status').style.color = "#28a745";
          document.getElementById('status').innerText = "✅ Đã gửi xong! Màn hình PC sẽ tự chọn ảnh ngay.";
        } else {
          document.getElementById('status').innerText = "❌ Lỗi gửi dữ liệu lên Firebase!";
        }
      } catch (err) {
        document.getElementById('status').innerText = "❌ Lỗi kết nối mạng, thử lại!";
      }
    }
  </script>
</body>
</html>
