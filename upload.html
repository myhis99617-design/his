<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tăng Độ Phân Giải 4K & Nén Dung Lượng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; text-align: center; margin: 0; padding: 15px; background: #f4f6f8; color: #333; }
    h2 { margin-top: 5px; font-size: 20px; }
    .btn { background: #007bff; color: white; border: none; padding: 10px 14px; font-size: 14px; border-radius: 6px; cursor: pointer; margin: 4px; font-weight: 500; }
    .btn-gallery { background: #17a2b8; }
    .btn-success { background: #28a745; font-weight: bold; width: 100%; max-width: 400px; margin-top: 15px; padding: 14px; font-size: 16px; border-radius: 8px; border: none; color: white; cursor: pointer; }
    .btn-rotate { background: #ffc107; color: #000; }
    #img-container { max-width: 100%; max-height: 380px; margin: 15px 0; display: none; background: #e9ecef; border-radius: 8px; overflow: hidden; }
    img { max-width: 100%; }
  </style>
</head>
<body>
  <h2>🔍 Chụp, Phóng Đại 4K & Nén Siêu Nhẹ</h2>
  
  <input type="file" id="photoCamera" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="photoGallery" accept="image/*" style="display:none">

  <button class="btn" onclick="document.getElementById('photoCamera').click()">📸 Chụp mới</button>
  <button class="btn btn-gallery" onclick="document.getElementById('photoGallery').click()">🖼️ Chọn từ máy</button>

  <div id="img-container">
    <img id="image" src="">
  </div>

  <div id="tools" style="display:none;">
    <button class="btn btn-rotate" onclick="cropper.rotate(-90)">↺ Xoay trái</button>
    <button class="btn btn-rotate" onclick="cropper.rotate(90)">↻ Xoay phải</button>
    <br>
    <button class="btn btn-success" onclick="uploadImage()">✅ XÁC NHẬN & GỬI LÊN PC</button>
  </div>

  <p id="status" style="font-weight:bold; margin-top:15px; color:#d9534f;"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session');
    const FIREBASE_URL = "https://my-qr-upload-default-rtdb.firebaseio.com";

    let cropper = null;
    const image = document.getElementById('image');

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        image.src = event.target.result;
        document.getElementById('img-container').style.display = 'block';
        document.getElementById('tools').style.display = 'block';

        if (cropper) cropper.destroy();
        cropper = new Cropper(image, {
          viewMode: 1,
          autoCropArea: 0.98,
          responsive: true
        });
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('photoCamera').onchange = handleFileSelect;
    document.getElementById('photoGallery').onchange = handleFileSelect;

    // Thuật toán làm đanh sắc nét viền điểm ảnh sau khi phóng đại
    function sharpenCanvas(canvas) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;
      const buff = new Uint8ClampedArray(data);
      const mix = 0.25; // Độ nét viền chống mờ nhòe pixel

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = (y * w + x) * 4;
          for (let c = 0; c < 3; c++) {
            const center = buff[idx + c];
            const up = buff[((y - 1) * w + x) * 4 + c];
            const down = buff[((y + 1) * w + x) * 4 + c];
            const left = buff[(y * w + (x - 1)) * 4 + c];
            const right = buff[(y * w + (x + 1)) * 4 + c];

            const sharpened = center * 5 - (up + down + left + right);
            data[idx + c] = Math.min(255, Math.max(0, center * (1 - mix) + sharpened * mix));
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    async function uploadImage() {
      if (!cropper) return;
      document.getElementById('status').style.color = "#d9534f";
      document.getElementById('status').innerText = "⏳ Đang phóng đại độ phân giải 4K & nén dung lượng...";

      // 1. Tính toán tăng kích thước ảnh gấp 1.5 - 2 lần ảnh chụp gốc
      const cropData = cropper.getData(true);
      const scaleFactor = 1.5; 
      let targetWidth = Math.round(cropData.width * scaleFactor);
      let targetHeight = Math.round(cropData.height * scaleFactor);

      // Đảm bảo kích thước điểm ảnh luôn đạt chuẩn Ultra HD (>3000px)
      const maxDim = Math.max(targetWidth, targetHeight);
      if (maxDim < 3000) {
        const boost = 3000 / maxDim;
        targetWidth = Math.round(targetWidth * boost);
        targetHeight = Math.round(targetHeight * boost);
      }
      
      // Giới hạn an toàn tối đa 4096px tránh quá tải bộ nhớ
      if (targetWidth > 4096 || targetHeight > 4096) {
        if (targetWidth > targetHeight) {
          targetHeight = Math.round((targetHeight * 4096) / targetWidth);
          targetWidth = 4096;
        } else {
          targetWidth = Math.round((targetWidth * 4096) / targetHeight);
          targetHeight = 4096;
        }
      }

      // 2. Xuất ảnh ở độ phân giải siêu cao (High Smooth Quality)
      const canvas = cropper.getCroppedCanvas({ 
        width: targetWidth, 
        height: targetHeight,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'high'
      });

      // 3. Tăng độ nét đanh cho các đường viền sau khi phóng đại
      sharpenCanvas(canvas);

      // 4. Nén JPEG thông minh (Chất lượng 0.72) -> Giữ kích thước nhẹ (~150KB - 300KB)
      const base64Image = canvas.toDataURL('image/jpeg', 0.72);

      try {
        const res = await fetch(`${FIREBASE_URL}/sessions/${session}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: base64Image })
        });

        if (res.ok) {
          document.getElementById('status').style.color = "#28a745";
          const approxSize = Math.round((base64Image.length * 3 / 4) / 1024);
          document.getElementById('status').innerText = `✅ Đã gửi! Độ phân giải: ${canvas.width}x${canvas.height}px (~${approxSize} KB)`;
        } else {
          document.getElementById('status').innerText = "❌ Lỗi kết nối Firebase!";
        }
      } catch (err) {
        document.getElementById('status').innerText = "❌ Lỗi đường truyền mạng!";
      }
    }
  </script>
</body>
</html>
